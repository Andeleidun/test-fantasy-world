<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Erde: reading the landscape</title><desc id="desc">Latitude, mountains and water describe different parts of a place.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#467789"/></marker><linearGradient id="light"><stop stop-color="#d9b26a"/><stop offset=".42" stop-color="#d9b26a"/><stop offset=".5" stop-color="#77916f"/><stop offset=".58" stop-color="#344d49"/><stop offset="1" stop-color="#192e35"/></linearGradient></defs><rect width="1000" height="720" fill="#faf7ed"/><g font-family="Georgia,serif"><text x="38" y="52" font-size="32" fill="#253932" text-anchor="start" font-weight="normal">Erde: reading the landscape</text><text x="38" y="84" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">Latitude, mountains and water describe different parts of a place.</text><rect x="38" y="120" width="270" height="455" rx="12" fill="#e9e2c7"/><text x="60" y="154" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Latitude</text><text x="60" y="187" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Latitude influences light</text><text x="60" y="214" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">and seasonal conditions.</text><text x="60" y="241" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal"></text><text x="60" y="268" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Local relief and water</text><text x="60" y="295" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">also shape the landscape.</text><line x1="65" y1="318" x2="280" y2="318" stroke="#978861" stroke-width="2" stroke-dasharray="5 5"/><text x="65" y="344" font-size="17" fill="#253932" text-anchor="start" font-weight="normal">Higher latitudes</text><line x1="65" y1="390" x2="280" y2="390" stroke="#978861" stroke-width="2" stroke-dasharray="5 5"/><text x="65" y="416" font-size="17" fill="#253932" text-anchor="start" font-weight="normal">Middle latitudes</text><line x1="65" y1="462" x2="280" y2="462" stroke="#978861" stroke-width="2" stroke-dasharray="5 5"/><text x="65" y="488" font-size="17" fill="#253932" text-anchor="start" font-weight="normal">Equatorial country</text><path d="M350 506 L430 390 L510 347 L600 199 L695 337 L755 415 L880 466 L960 506 Z" fill="#dce5cc" stroke="#7b8b70" stroke-width="2" /><path d="M558 261 L600 199 L647 270 L618 257 L599 275 L581 253 Z" fill="#eff1e8" stroke="#eff1e8" stroke-width="2" /><path d="M430 403 C455 435 450 477 505 519 C577 552 617 513 656 553" fill="none" stroke="#467789" stroke-width="5" /><text x="350" y="158" font-size="25" fill="#253932" text-anchor="start" font-weight="normal">Relief and water</text><text x="628" y="233" font-size="19" fill="#253932" text-anchor="start" font-weight="normal">High country</text><text x="366" y="580" font-size="19" fill="#253932" text-anchor="start" font-weight="normal">Valleys and rivers</text><text x="728" y="412" font-size="18" fill="#253932" text-anchor="start" font-weight="normal">Sheltered slopes</text><text x="355" y="615" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Mountain chains divide interiors; rivers connect settlements.</text><line x1="38" y1="665" x2="962" y2="665" stroke="#c8d0c2" stroke-width="1" stroke-dasharray=""/><text x="38" y="694" font-size="16" fill="#52645d" text-anchor="start" font-weight="normal">E2 | Qualitative section; no temperature, rainfall or elevation scale is assigned.</text></g></svg>