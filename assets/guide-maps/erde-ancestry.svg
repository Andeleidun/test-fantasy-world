<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Erde: ancestry and the Thal migration</title><desc id="desc">Broad inferred descent and a much later historical journey.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#467789"/></marker><linearGradient id="light"><stop stop-color="#d9b26a"/><stop offset=".42" stop-color="#d9b26a"/><stop offset=".5" stop-color="#77916f"/><stop offset=".58" stop-color="#344d49"/><stop offset="1" stop-color="#192e35"/></linearGradient></defs><rect width="1000" height="720" fill="#faf7ed"/><g font-family="Georgia,serif"><text x="38" y="52" font-size="32" fill="#253932" text-anchor="start" font-weight="normal">Erde: ancestry and the Thal migration</text><text x="38" y="84" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">Broad inferred descent and a much later historical journey.</text><rect x="340" y="115" width="320" height="90" rx="12" fill="#e9e2c7"/><text x="362" y="149" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Shared deep ancestry</text><path d="M500 205 L500 234 L230 234 L230 268" fill="none" stroke="#467789" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 234 L758 234 L758 268" fill="none" stroke="#467789" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="278" width="410" height="130" rx="12" fill="#dce5cc"/><text x="60" y="312" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Human branches</text><text x="60" y="345" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Separation, migration and later contact.</text><text x="60" y="372" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Some branches exchange ancestry.</text><rect x="550" y="278" width="410" height="130" rx="12" fill="#dce5cc"/><text x="572" y="312" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Hobbit lineages</text><text x="572" y="345" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Island, highland and seafaring branches.</text><text x="572" y="372" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Different histories and ways of living.</text><line x1="448" y1="355" x2="550" y2="355" stroke="#467789" stroke-width="2" stroke-dasharray="5 5"/><text x="500" y="447" font-size="18" fill="#52645d" text-anchor="middle" font-weight="normal">Human–hobbit interbreeding is rare and usually has low fertility.</text><rect x="38" y="485" width="410" height="135" rx="12" fill="#e9e2c7"/><text x="60" y="519" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">The Thal departure</text><text x="60" y="552" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Erde refugees passed through the</text><text x="60" y="579" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Otherworld about 5,000 years ago.</text><rect x="550" y="485" width="410" height="135" rx="12" fill="#d9e7e8"/><text x="572" y="519" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Dverghamar</text><text x="572" y="552" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Thal descendants settled among</text><text x="572" y="579" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">native peoples with separate ancestry.</text><path d="M448 551 L542 551" fill="none" stroke="#467789" stroke-width="3" marker-end="url(#arrow)"/><line x1="38" y1="665" x2="962" y2="665" stroke="#c8d0c2" stroke-width="1" stroke-dasharray=""/><text x="38" y="694" font-size="16" fill="#52645d" text-anchor="start" font-weight="normal">E4 | Branching dates and a detailed family tree remain uncertain. Culture does not follow descent alone.</text></g></svg>