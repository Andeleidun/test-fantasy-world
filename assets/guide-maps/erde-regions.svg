<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Erde: regions and routes</title><desc id="desc">Regional contact, coastal passages and the headwater approach.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#467789"/></marker><linearGradient id="light"><stop stop-color="#d9b26a"/><stop offset=".42" stop-color="#d9b26a"/><stop offset=".5" stop-color="#77916f"/><stop offset=".58" stop-color="#344d49"/><stop offset="1" stop-color="#192e35"/></linearGradient></defs><rect width="1000" height="720" fill="#faf7ed"/><g font-family="Georgia,serif"><text x="38" y="52" font-size="32" fill="#253932" text-anchor="start" font-weight="normal">Erde: regions and routes</text><text x="38" y="84" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">Regional contact, coastal passages and the headwater approach.</text><rect x="38" y="113" width="190" height="519" rx="12" fill="#d9e7e8"/><text x="62" y="153" font-size="24" fill="#253932" text-anchor="start" font-weight="normal">Coastal route</text><text x="62" y="187" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Short voyages,</text><text x="62" y="214" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">estuaries and</text><text x="62" y="241" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">offshore islands.</text><path d="M155 275 C78 312 100 365 180 366 L270 366" fill="none" stroke="#467789" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="278" y="116" width="310" height="128" rx="12" fill="#dce5cc"/><text x="300" y="150" font-size="19" fill="#253932" text-anchor="start" font-weight="bold">Coasts and mountain rim</text><text x="300" y="183" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Early approach; later</text><text x="300" y="210" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">mixed successor communities.</text><rect x="648" y="116" width="310" height="164" rx="12" fill="#dce5cc"/><text x="670" y="150" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Great Watersheds</text><text x="670" y="183" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Rivers, lakes and wetlands.</text><text x="670" y="210" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Defended interior crossings;</text><text x="670" y="237" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">basin councils and orders.</text><line x1="588" y1="177" x2="642" y2="177" stroke="#467789" stroke-width="3" stroke-dasharray="6 5"/><text x="636" y="310" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">Coastal travel bypasses</text><text x="636" y="333" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">the defended interior.</text><rect x="278" y="298" width="310" height="137" rx="12" fill="#dce5cc"/><text x="300" y="332" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Volcanic Hinge</text><text x="300" y="365" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Highlands, islands and valleys.</text><text x="300" y="392" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Warnings and maritime refuges.</text><rect x="278" y="476" width="310" height="137" rx="12" fill="#dce5cc"/><text x="300" y="510" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Highland Spine</text><text x="300" y="543" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Coasts, valleys and plateaus.</text><text x="300" y="570" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Guides and refuge houses.</text><rect x="648" y="476" width="310" height="137" rx="12" fill="#dce5cc"/><text x="670" y="510" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Equatorial Basin</text><text x="670" y="543" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Headwaters, forests and rivers.</text><text x="670" y="570" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">River-garden houses.</text><path d="M424 244 L424 291" fill="none" stroke="#467789" stroke-width="3" marker-end="url(#arrow)"/><path d="M424 435 L424 469" fill="none" stroke="#467789" stroke-width="3" marker-end="url(#arrow)"/><path d="M588 541 L640 541" fill="none" stroke="#467789" stroke-width="3" marker-end="url(#arrow)"/><text x="618" y="580" font-size="12" fill="#52645d" text-anchor="middle" font-weight="normal">Headwater</text><text x="618" y="598" font-size="12" fill="#52645d" text-anchor="middle" font-weight="normal">route</text><line x1="38" y1="665" x2="962" y2="665" stroke="#c8d0c2" stroke-width="1" stroke-dasharray=""/><text x="38" y="694" font-size="16" fill="#52645d" text-anchor="start" font-weight="normal">E1 · E3 · E5 | Route relationships only; arrows summarize later migration, not a single journey.</text></g></svg>