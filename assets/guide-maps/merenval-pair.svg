<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc"><title id="title">Merenval and its companion</title><desc id="desc">Two inhabited landscapes, with continuing contact and distinct communities.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#467789"/></marker><linearGradient id="light"><stop stop-color="#d9b26a"/><stop offset=".42" stop-color="#d9b26a"/><stop offset=".5" stop-color="#77916f"/><stop offset=".58" stop-color="#344d49"/><stop offset="1" stop-color="#192e35"/></linearGradient></defs><rect width="1000" height="740" fill="#faf7ed"/><g font-family="Georgia,serif"><text x="38" y="52" font-size="32" fill="#253932" text-anchor="start" font-weight="normal">Merenval and its companion</text><text x="38" y="84" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">Two inhabited landscapes, with continuing contact and distinct communities.</text><rect x="38" y="118" width="438" height="438" rx="12" fill="#d9e7e8"/><rect x="522" y="118" width="438" height="438" rx="12" fill="#e7dfcf"/><text x="65" y="158" font-size="29" fill="#253932" text-anchor="start" font-weight="normal">Merenval</text><text x="549" y="158" font-size="27" fill="#253932" text-anchor="start" font-weight="normal">The inhabited companion</text><path d="M60 344 Q118 321 145 339 T245 355 T353 339 T456 351 L456 407 L60 407Z" fill="#94bcc6" stroke="none" stroke-width="2" /><path d="M60 334 L95 261 L136 290 L191 220 L260 313 L327 271 L383 320 L456 295 L456 342 Q350 380 260 346 T60 364Z" fill="#dce5cc" stroke="#7b8b70" stroke-width="2" /><path d="M545 356 L578 356 L578 223 L611 223 L617 321 L645 321 L645 273 L683 273 L683 354 L719 354 L719 224 L752 224 L760 342 L792 342 L792 276 L918 276 L941 357Z" fill="#c4bba0" stroke="#877c65" stroke-width="2" /><path d="M791 357 C783 297 902 297 899 357" fill="#faf7ed" stroke="#877c65" stroke-width="2" /><text x="65" y="440" font-size="19" fill="#52645d" text-anchor="start" font-weight="normal">Connected seas, forests and wetlands.</text><text x="65" y="467" font-size="19" fill="#52645d" text-anchor="start" font-weight="normal">Forest and Maritime/Littoral Sylvans.</text><text x="65" y="494" font-size="19" fill="#52645d" text-anchor="start" font-weight="normal">Voyaging links coasts and islands.</text><text x="549" y="440" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Plateaus, pillars, caverns and separated seas.</text><text x="549" y="467" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Crystalline/High and Deep/Star Elves.</text><text x="549" y="494" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Gnome communities and living houses.</text><path d="M431 200 C486 175 513 175 565 200" fill="none" stroke="#467789" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="500" y="599" font-size="20" fill="#253932" text-anchor="middle" font-weight="normal">Travel and kinship connect the pair. Orc societies inhabit both worlds.</text><text x="500" y="630" font-size="18" fill="#52645d" text-anchor="middle" font-weight="normal">Similarities of life suggest shared ancestry; the early passage remains unknown.</text><line x1="38" y1="685" x2="962" y2="685" stroke="#c8d0c2" stroke-width="1" stroke-dasharray=""/><text x="38" y="714" font-size="16" fill="#52645d" text-anchor="start" font-weight="normal">Landscape comparison only; the drawing gives no orbital scale, fixed locations or exclusive territories.</text></g></svg>