<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Dverghamar: day, night and twilight</title><desc id="desc">The inhabited country follows light and water across a varied landscape.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#467789"/></marker><linearGradient id="light"><stop stop-color="#d9b26a"/><stop offset=".42" stop-color="#d9b26a"/><stop offset=".5" stop-color="#77916f"/><stop offset=".58" stop-color="#344d49"/><stop offset="1" stop-color="#192e35"/></linearGradient></defs><rect width="1000" height="720" fill="#faf7ed"/><g font-family="Georgia,serif"><text x="38" y="52" font-size="32" fill="#253932" text-anchor="start" font-weight="normal">Dverghamar: day, night and twilight</text><text x="38" y="84" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">The inhabited country follows light and water across a varied landscape.</text><circle cx="266" cy="324" r="184" fill="url(#light)" stroke="none" stroke-width="2"/><path d="M266 140 C231 231 231 414 266 508 C301 414 301 231 266 140" fill="#9aaf80" stroke="none" stroke-width="2" opacity=".55"/><text x="53" y="551" font-size="19" fill="#52645d" text-anchor="start" font-weight="normal">Sunward hemisphere</text><text x="308" y="551" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">Nightward hemisphere</text><line x1="266" y1="155" x2="352" y2="121" stroke="#52645d" stroke-width="2" stroke-dasharray=""/><text x="355" y="126" font-size="20" fill="#253932" text-anchor="start" font-weight="normal">Twilight</text><rect x="530" y="122" width="430" height="117" rx="12" fill="#e9d5ac"/><text x="552" y="156" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Sunward margin</text><text x="552" y="189" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Hot, dry ground; salt and brine basins.</text><text x="552" y="216" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Water-bearing refuges occur locally.</text><rect x="530" y="267" width="430" height="145" rx="12" fill="#dce5cc"/><text x="552" y="301" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Twilight landscapes</text><text x="552" y="334" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Lit slopes and watered valleys support</text><text x="552" y="361" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">most settlements and familiar large life.</text><text x="552" y="388" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Dry divides interrupt fertile districts.</text><rect x="530" y="440" width="430" height="117" rx="12" fill="#d9e4e8"/><text x="552" y="474" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Nightward country</text><text x="552" y="507" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Cold and darkness; ice farther nightward.</text><text x="552" y="534" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Reports of isolated warm sites.</text><text x="64" y="605" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Sunlight</text><path d="M158 598 L394 598" fill="none" stroke="#467789" stroke-width="3" marker-end="url(#arrow)"/><line x1="38" y1="665" x2="962" y2="665" stroke="#c8d0c2" stroke-width="1" stroke-dasharray=""/><text x="38" y="694" font-size="16" fill="#52645d" text-anchor="start" font-weight="normal">D1 · D2 | Twilight is not a uniform fertile ring. Widths and continental outlines are unspecified.</text></g></svg>