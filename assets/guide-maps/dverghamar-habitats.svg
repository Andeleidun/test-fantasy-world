<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Dverghamar: habitats and refuges</title><desc id="desc">Related peoples occupy varied ground; lakes and isolated sites support different life.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#467789"/></marker><linearGradient id="light"><stop stop-color="#d9b26a"/><stop offset=".42" stop-color="#d9b26a"/><stop offset=".5" stop-color="#77916f"/><stop offset=".58" stop-color="#344d49"/><stop offset="1" stop-color="#192e35"/></linearGradient></defs><rect width="1000" height="720" fill="#faf7ed"/><g font-family="Georgia,serif"><text x="38" y="52" font-size="32" fill="#253932" text-anchor="start" font-weight="normal">Dverghamar: habitats and refuges</text><text x="38" y="84" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">Related peoples occupy varied ground; lakes and isolated sites support different life.</text><rect x="38" y="121" width="292" height="204" rx="12" fill="#e9d5ac"/><text x="60" y="155" font-size="23" fill="#253932" text-anchor="start" font-weight="bold">Warm margins</text><text x="60" y="188" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Sunward peoples: dry heat</text><text x="60" y="215" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">and water conservation.</text><text x="60" y="242" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Volcanic ranges: humid</text><text x="60" y="269" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">heat, ash and local</text><text x="60" y="296" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">chemical exposure.</text><rect x="354" y="121" width="292" height="204" rx="12" fill="#dce5cc"/><text x="376" y="155" font-size="22" fill="#253932" text-anchor="start" font-weight="bold">Mountain interiors</text><text x="376" y="188" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Central massif peoples.</text><text x="376" y="215" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal"></text><text x="376" y="242" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">The deep-massif subspecies</text><text x="376" y="269" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">retains connections with</text><text x="376" y="296" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">shallower ecosystems.</text><rect x="670" y="121" width="292" height="204" rx="12" fill="#d9e4e8"/><text x="692" y="155" font-size="19" fill="#253932" text-anchor="start" font-weight="bold">Cold and high country</text><text x="692" y="188" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">Cold-edge peoples near the</text><text x="692" y="215" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">productive twilight region.</text><text x="692" y="242" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal"></text><text x="692" y="269" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">High-mountain peoples face</text><text x="692" y="296" font-size="18" fill="#52645d" text-anchor="start" font-weight="normal">thin air as well as cold.</text><text x="500" y="365" font-size="19" fill="#52645d" text-anchor="middle" font-weight="normal">Habitats overlap. These are not political or language borders.</text><path d="M45 484 Q145 470 240 502 Q320 560 451 512 Q548 478 655 514 Q797 480 962 496 L962 616 L38 616Z" fill="#dce5cc" stroke="#758870" stroke-width="2" /><path d="M156 490 Q249 539 363 500 Q363 572 255 584 Q170 571 156 490Z" fill="#94bcc6" stroke="none" stroke-width="2" /><text x="45" y="414" font-size="22" fill="#253932" text-anchor="start" font-weight="normal">Lakes and productive shores</text><text x="45" y="448" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">Some large lake animals reach several metres.</text><text x="45" y="475" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">Water depth alone does not establish safe fishing.</text><circle cx="796" cy="533" r="42" fill="#b69b74" stroke="none" stroke-width="2"/><circle cx="796" cy="533" r="25" fill="#c5d8cd" stroke="none" stroke-width="2"/><text x="590" y="585" font-size="21" fill="#253932" text-anchor="start" font-weight="normal">An isolated warm refuge</text><text x="590" y="414" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">Ice and darkness surround warm sites.</text><text x="590" y="441" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">Reports describe sparse small life;</text><text x="590" y="468" font-size="17" fill="#52645d" text-anchor="start" font-weight="normal">many places remain undescribed.</text><line x1="38" y1="665" x2="962" y2="665" stroke="#c8d0c2" stroke-width="1" stroke-dasharray=""/><text x="38" y="694" font-size="16" fill="#52645d" text-anchor="start" font-weight="normal">D3 · D6 · D8 | A habitat comparison, not a species range map or a wildlife identification plate.</text></g></svg>