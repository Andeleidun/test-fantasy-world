  <g id="text_11">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #243c43" x="1100.16" y="35.28" transform="rotate(-0 1100.16 35.28)">DVERGHAMAR  /  D8</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243c43" x="51.84" y="76.32" transform="rotate(-0 51.84 76.32)">Hidden habitats: deep lake and ice-bound oasis</text>
  </g>
  <g id="text_13">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536a6e" x="51.84" y="104.4" transform="rotate(-0 51.84 104.4)">Two sectional habitat maps with very different energy supplies and carrying capacities.</text>
  </g>
  <g id="text_14">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536a6e" x="51.84" y="695.52" transform="rotate(-0 51.84 695.52)">SCHEMATIC SECTIONS: no common horizontal or vertical scale. Layer depths and oasis dimensions are unselected. [35-38]</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #243c43" x="1100.16" y="695.52" transform="rotate(-0 1100.16 695.52)">D8</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243c43" x="69.12" y="569.958281" transform="rotate(-0 69.12 569.958281)">Lake scale and fauna</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(69.12 590.458359)">Largest lakes: 50,000-150,000 km2. Common large</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(69.12 604.210652)">species: 2-5 m; rare forms may reach 1-3 tonnes,</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(69.12 617.962945)">where food and oxygen budgets permit.</text>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243c43" x="616.32" y="569.958281" transform="rotate(-0 616.32 569.958281)">Oasis scale and fauna</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(616.32 590.458359)">Small consumers in the selected model;</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(616.32 604.210652)">local production limits size; poor systems may</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(616.32 617.962945)">contain microbes alone. Heat maintains habitat but is</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(616.32 631.715238)">not food.</text>
  </g>
