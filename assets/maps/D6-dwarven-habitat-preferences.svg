   <g id="text_14">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #243c43" transform="translate(408.67944 480.133196)">Deep-massif</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #243c43" transform="translate(412.586472 491.331009)">subspecies</text>
