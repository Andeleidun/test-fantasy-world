   <g id="text_15">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243c43" x="551.498507" y="390.29304" transform="rotate(-0 551.498507 390.29304)">Nightward</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243c43" x="494.758209" y="216.838494" transform="rotate(-0 494.758209 216.838494)">High-mountain</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52738e" transform="translate(669.019592 274.113466)">NO NATIVE DWARF</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52738e" transform="translate(665.096936 285.311278)">ORIGIN IN ISOLATED</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52738e" transform="translate(655.242248 296.509091)">DEEP-NIGHTSIDE OASES</text>
   </g>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536a6e" x="51.84" y="35.28" transform="rotate(-0 51.84 35.28)">ANDEL'S SONG / FIELD ATLAS</text>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #243c43" x="1100.16" y="35.28" transform="rotate(-0 1100.16 35.28)">DWARVEN PLANET  /  D6</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243c43" x="51.84" y="76.32" transform="rotate(-0 51.84 76.32)">Six living forms, overlapping habitat preferences</text>
  </g>
  <g id="text_21">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536a6e" x="51.84" y="104.4" transform="rotate(-0 51.84 104.4)">An ecological placement map, not exclusive species territories or a finished anatomical comparison.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536a6e" x="51.84" y="695.52" transform="rotate(-0 51.84 695.52)">SELECTED: five species and one subspecies. HORIZONTAL POSITIONS AND HABITAT PATCH SIZES ARE SCHEMATIC. [35-37]</text>
  </g>
  <g id="text_23">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #243c43" x="1100.16" y="695.52" transform="rotate(-0 1100.16 695.52)">D6</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536a6e" x="74.88" y="133.2" transform="rotate(-0 74.88 133.2)">Habitat level is qualitative, not an elevation scale</text>
  </g>
  <g id="text_25">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243c43" x="881.28" y="159.558281" transform="rotate(-0 881.28 159.558281)">Warm branch</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 180.058359)">Sunward and volcanic-range</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 193.810652)">species are closest relatives.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 207.562945)">Water conservation and heat</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 221.315238)">loss come with tradeoffs.</text>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243c43" x="881.28" y="303.558281" transform="rotate(-0 881.28 303.558281)">Central branch</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 324.058359)">Deep-massif is a subspecies of</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 337.810652)">central-massif, originating in</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 351.562945)">surface-fed caves and aquifers</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 365.315238)">tens to hundreds of metres</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 379.067531)">deep.</text>
  </g>
  <g id="text_29">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243c43" x="881.28" y="461.958281" transform="rotate(-0 881.28 461.958281)">Cold-upland branch</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 482.458359)">Nightward evolved near the</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 496.210652)">cold photic margin. High-</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 509.962945)">mountain evolved in cold,</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 523.715238)">naturally unpressurized</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(881.28 537.467531)">highlands.</text>
  </g>
  <g id="text_31">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243c43" x="74.88" y="605.958281" transform="rotate(-0 74.88 605.958281)">Range overlap is expected</text>
  </g>
  <g id="text_32">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(74.88 626.458359)">Historical isolation, mating barriers, and later contact matter. The Thals are immigrants from Erde and do</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536a6e" transform="translate(74.88 640.210652)">not belong to this native dwarf radiation.</text>
  </g>
 </g>
