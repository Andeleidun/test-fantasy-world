name: Build and deploy world guide

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and verify content and links
        run: npm test
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install atlas dependencies
        run: python -m pip install -r scripts/editorial/requirements-atlas.txt
      - name: Regenerate and assert Strategy A geometry
        env:
          ERDE_GEOMETRY_ONLY: '1'
        run: |
          python scripts/editorial/try_erde_global.py
          cat docs/global-geography-trial/measurements.json
      - name: Validate dated constraint graph
        run: python scripts/editorial/validate_erde_constraint_graph.py
      - name: Validate dated physical tests
        run: python scripts/editorial/validate_erde_physical_tests.py
      - name: Run Strategy A geological audit
        run: python scripts/editorial/validate_erde_history.py
      - name: Replay paleolatitude checks
        run: python scripts/editorial/check_erde_paleolatitudes.py
      - name: Upload reconstruction outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erde-reconstruction-${{ github.sha }}
          path: docs/global-geography-trial/
          if-no-files-found: error
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check interaction, responsive layout and accessibility
        run: npm run test:e2e
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
